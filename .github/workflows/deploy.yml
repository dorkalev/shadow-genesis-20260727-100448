# The only production deployment path: a protected merge to main obtains a
# short-lived GCP credential through Workload Identity Federation. No JSON key
# or model API is involved.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Authenticate to Google Cloud without a stored key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Build and push the immutable image
        run: |
          set -euo pipefail
          IMAGE="${{ vars.GCP_ARTIFACT_REPO }}/${{ vars.GCP_SERVICE }}:${GITHUB_SHA::12}"
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" app
          docker push "$IMAGE"
          DIGEST=$(gcloud artifacts docker images describe "$IMAGE" --format='value(image_summary.digest)')
          if [ -z "$DIGEST" ]; then
            echo "::error::could not resolve the pushed image digest"
            exit 1
          fi
          IMAGE_DIGEST="${IMAGE%:*}@$DIGEST"
          echo "IMAGE_DIGEST=$IMAGE_DIGEST" >> "$GITHUB_ENV"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "${{ vars.GCP_SERVICE }}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --image "$IMAGE_DIGEST" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet

      - name: Record the deployment
        run: |
          echo "Deployed \`$IMAGE_DIGEST\` from \`${GITHUB_SHA}\` (run ${{ github.run_id }})" >> "$GITHUB_STEP_SUMMARY"
