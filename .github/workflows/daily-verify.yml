# Daily shadow audit — the clock loop, made reliable.
#
# Two layers:
#   1. Deterministic drift monitor (fast, no LLM) — the pass/fail signal. Checks the
#      key controls via `gh` and opens an issue (label: shadow) if any regressed.
#      This is the CC4.1 evidence: a monitor that runs green every day and flags drift.
#   2. Optional bounded LLM enrichment — a distinct reviewer/verifier agent re-checks a
#      SMALL ROTATING subset of criteria (full coverage rolls over ~10 days), hard-capped
#      so it can never hang or fail the job. Requires ANTHROPIC_API_KEY.
#
# The old design ran an 80-turn agent over all 61 criteria in CI and timed out; this
# separates the reliable deterministic signal from the best-effort LLM pass.
name: Daily Shadow Verify

on:
  schedule:
    - cron: "17 5 * * *"   # daily, off the hour to avoid the cron stampede
  workflow_dispatch: {}

permissions:
  contents: read          # read-only: nothing here writes the repo (least privilege)
  issues: write           # only to open/append the drift ticket
  pull-requests: read
  checks: read
  security-events: read   # read code-scanning alerts

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HAS_LLM: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # ---- Layer 1: deterministic drift monitor (the pass/fail signal) ----
      - name: Drift monitor (deterministic)
        id: drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Admin-scoped fine-grained PAT (Administration:read, code-scanning:read,
          # Dependabot alerts:read) for config-drift checks the GITHUB_TOKEN can't read.
          ADMIN_TOKEN: ${{ secrets.SHADOW_ADMIN_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Tri-state monitor: ok / FAIL / unknown. errexit OFF — run every check.
          # THE RULE: `gh api` prints HTTP error bodies to STDOUT and exits non-zero, so
          # we NEVER parse output to decide readability — we gate on gh's EXIT CODE.
          #   if out=$(gh api ...); then <it read OK, decide ok/FAIL> else <unknown> fi
          # Unreadable (403/404/network/expired-PAT) is always UNKNOWN, never a regression.
          # Only a SUCCESSFUL read that shows a control OFF is a FAIL. The monitor can thus
          # never emit a false drift ticket for something it merely couldn't read.
          set +e
          set -u
          REPORT="shadow/verify-$(date -u +%F).md"
          mkdir -p shadow
          { echo "# Daily drift monitor — $(date -u +%FT%TZ)"; echo; } > "$REPORT"
          fails=(); unknowns=()
          check() { if [ "$2" = "1" ]; then echo "  ok   $1"; echo "- ok — $1" >> "$REPORT"
            else echo "  FAIL $1"; echo "- **FAIL** — $1" >> "$REPORT"; fails+=("$1"); fi; }
          unknown() { echo "  ??   $1"; echo "- _unknown_ — $1" >> "$REPORT"; unknowns+=("$1"); }
          has() { printf '%s' "$1" | grep -qF "$2"; }    # fixed-string contains

          # --- change-management enforcement on BOTH rulesets (staging = every PR's base;
          #     main = production). Verify the required-check CONTEXTS, not just rule types.
          for br in main staging; do
            if body=$(gh api "repos/$REPO/rules/branches/$br" 2>/dev/null); then
              types=$(printf '%s' "$body" | jq -r '[.[].type]|join(",")' 2>/dev/null)
              ctx=$(printf '%s' "$body" | jq -r '[.[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context]|join(",")' 2>/dev/null)
              for want in compliance-audit compliance-review-gate; do
                has ",$ctx," ",$want," && check "$br ruleset requires '$want' status check" 1 || check "$br ruleset requires '$want' status check" 0
              done
              has "$types" pull_request && check "$br ruleset requires pull_request" 1 || check "$br ruleset requires pull_request" 0
              has "$types" non_fast_forward && check "$br ruleset blocks force-push" 1 || check "$br ruleset blocks force-push" 0
            else
              unknown "$br ruleset unreadable — cannot verify change-mgmt enforcement (token/network)"
            fi
          done

          # --- open high/critical code-scanning alerts (default token; security-events:read)
          if hi=$(gh api "repos/$REPO/code-scanning/alerts?state=open&severity=high" --jq 'length' 2>/dev/null) \
             && crit=$(gh api "repos/$REPO/code-scanning/alerts?state=open&severity=critical" --jq 'length' 2>/dev/null); then
            if [ "$((hi+crit))" = "0" ]; then check "no open high/critical code-scanning alerts" 1
            else check "open high/critical code-scanning alerts: $((hi+crit))" 0; fi
          else
            unknown "code-scanning alerts unreadable (no analyses / perms) — not counted"
          fi

          # --- security-config controls (need admin PAT). Missing PAT, invalid PAT, or a
          #     per-endpoint read failure ALL yield unknown; only a successful read that
          #     shows a control OFF is a FAIL.
          if [ -z "${ADMIN_TOKEN:-}" ]; then
            unknown "CodeQL default setup — needs SHADOW_ADMIN_TOKEN (admin) to verify"
            unknown "Dependabot vulnerability alerts — needs SHADOW_ADMIN_TOKEN to verify"
            unknown "secret scanning + push protection — needs SHADOW_ADMIN_TOKEN to verify"
          else
            A() { GH_TOKEN="$ADMIN_TOKEN" gh "$@" 2>/dev/null; }
            if st=$(A api "repos/$REPO/code-scanning/default-setup" --jq '.state'); then
              [ "$st" = "configured" ] && check "CodeQL default setup configured" 1 || check "CodeQL default setup: ${st:-empty}" 0
            else unknown "CodeQL default setup — admin token cannot read (missing scope/expired)"; fi

            # -i keeps the status line even on non-2xx; 204=enabled, 404=disabled(FAIL), else unknown
            # 204 = unambiguously enabled (pass). 404 is AMBIGUOUS — GitHub returns it both
            # when alerts are disabled AND when the token lacks the scope to see them — so we
            # never treat it as a regression; only a confirmed-enabled 204 is a pass.
            hdr=$(A api "repos/$REPO/vulnerability-alerts" -i); code=$(printf '%s' "$hdr" | head -1 | grep -oE '[0-9]{3}' | head -1)
            case "${code:-none}" in
              204) check "Dependabot vulnerability alerts enabled" 1 ;;
              *)   unknown "Dependabot vulnerability alerts — HTTP ${code:-none} (404 is ambiguous: disabled OR token under-scoped); not counted" ;;
            esac

            # GET /repos returns 200 even without Administration:read — it just OMITS the
            # security_and_analysis block. So exit-code success is not enough; we must
            # confirm the block is actually present. Absent block (jq → "null") = unknown,
            # NOT a fail (an under-scoped PAT must never read as a control regression).
            sa=$(A api "repos/$REPO" --jq '.security_and_analysis // "ABSENT"')
            if [ -z "$sa" ] || [ "$sa" = "ABSENT" ] || [ "$sa" = "null" ]; then
              unknown "secret scanning — security_and_analysis not visible (token lacks Administration:read)"
            else
              ss=$(printf '%s' "$sa" | jq -r '.secret_scanning.status // "absent"' 2>/dev/null)
              pp=$(printf '%s' "$sa" | jq -r '.secret_scanning_push_protection.status // "absent"' 2>/dev/null)
              if [ "$ss" = "absent" ] || [ "$pp" = "absent" ]; then unknown "secret scanning — status fields absent (token scope)"
              elif [ "$ss/$pp" = "enabled/enabled" ]; then check "secret scanning + push protection enabled" 1
              else check "secret scanning + push protection: $ss/$pp" 0; fi
            fi
          fi

          # --- local artifacts (always readable on the checkout)
          [ "$(ls policies/*.md 2>/dev/null | wc -l)" -ge 20 ] && check "policy pack present (>=20)" 1 || check "policy pack present (>=20)" 0
          [ -f policies/controls.md ] && check "controls.md present" 1 || check "controls.md present" 0

          [ "${#unknowns[@]}" -gt 0 ] && { echo; echo "_${#unknowns[@]} check(s) unverifiable (unknown) — not counted as pass or fail._" >> "$REPORT"; }
          if [ "${#fails[@]}" -gt 0 ]; then
            sm="${#fails[@]} control(s) regressed: $(IFS=';'; echo "${fails[*]}")"
            { echo; echo "**Result: DRIFT — $sm**"; } >> "$REPORT"
            echo "summary=$sm" >> "$GITHUB_OUTPUT"
            echo "DRIFT DETECTED: ${#fails[@]} regression(s)"; exit 1
          fi
          { echo; echo "**Result: all monitored controls green (${#unknowns[@]} unknown)**"; } >> "$REPORT"
          echo "summary=all monitored controls green (${#unknowns[@]} unknown)" >> "$GITHUB_OUTPUT"
          echo "NO DRIFT — all monitored controls green (${#unknowns[@]} unknown, not counted)"

      - name: Open a drift ticket on regression (deduped)
        if: failure() && steps.drift.outputs.summary != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SUMMARY: ${{ steps.drift.outputs.summary }}
        run: |
          set +e
          # dedup: reuse the existing open drift ticket instead of opening one daily
          existing=$(gh issue list --repo "$REPO" --label shadow --state open --search "Control drift in:title" --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Drift still present $(date -u +%F): $SUMMARY" >/dev/null 2>&1
          else
            gh issue create --repo "$REPO" --label shadow \
              --title "Control drift detected" \
              --body "The daily deterministic monitor found a regression: $SUMMARY. Investigate and restore the control through the change gate. This ticket is reused (commented) daily until the drift clears." >/dev/null 2>&1
          fi

      # ---- Layer 2: bounded LLM enrichment (best-effort, never fails the job) ----
      - name: Install Claude Code
        if: ${{ always() && env.HAS_LLM == 'true' }}
        continue-on-error: true   # best-effort: an npm blip must not redden the daily
        timeout-minutes: 3        # evidence signal (the enrichment tolerates a missing CLI)
        run: npm install -g @anthropic-ai/claude-code

      - name: LLM re-check (rotating subset, hard-capped)
        if: ${{ always() && env.HAS_LLM == 'true' }}
        continue-on-error: true
        timeout-minutes: 8
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # pick ~6 criteria for today by day-of-year, so full coverage rolls over ~10 days
          mapfile -t ALL < <(ls .shadow/criteria/*.md 2>/dev/null | xargs -n1 basename | sed 's/.md$//')
          [ "${#ALL[@]}" -eq 0 ] && { echo "no criteria corpus vendored; skipping"; exit 0; }
          doy=$(date -u +%j); n=${#ALL[@]}; take=6
          subset=""; for i in $(seq 0 $((take-1))); do idx=$(( (10#$doy * take + i) % n )); subset="$subset ${ALL[$idx]}"; done
          echo "today's subset:$subset"
          # read-only surface: gh (read APIs) + file reads, no arbitrary Bash — the
          # enrichment only inspects and reports; it must not mutate anything.
          claude -p "You are the shadow verifier. For ONLY these criteria:$subset — read .shadow/criteria/<id>.md, run their non-MANUAL automated checks with gh, and note any that fail. Be terse. Do not modify files." \
            --allowedTools "Bash(gh:*),Read,Glob,Grep" \
            --max-turns 15 || echo "LLM enrichment skipped/failed (non-blocking)"

      - name: Upload verify report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shadow-verify-${{ github.run_id }}
          path: shadow/verify-*.md
          retention-days: 400
          if-no-files-found: ignore
